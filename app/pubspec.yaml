name: hostelpass
description: "HostelPass — smart hostel attendance with face recognition and GPS geofencing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Location & camera & ML
  geolocator: ^14.0.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Misc
  intl: ^0.20.2
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_hostelpass.png
    - assets/images/student_avatar.jpg
    - assets/models/mobilefacenet.tflite
    - assets/models/FaceAntiSpoofing.tflite

  # Bundled Inter (variable, SIL OFL 1.1) — no runtime font downloads.
  # Declared at several weights so Flutter drives the variable `wght` axis
  # instead of applying faux-bold.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
